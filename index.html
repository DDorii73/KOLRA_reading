<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문단글 읽기 유창성 검사 보조 Web-app</title>
  <link rel="stylesheet" href="/src/styles.css">
  <script type="module" src="/src/index.js" defer></script>
</head>
<body>
  <main>
    <section class="hero landing-hero">
      <div class="hero-copy">
        <p class="eyebrow">Teacher Reading Fluency Assistant</p>
        <h1>문단글 읽기 유창성 검사 보조 Web-app</h1>
        <p class="hero-description">
          학생의 문단글 읽기 전사 자료를 바탕으로 읽기 속도, 오류 유형, 유창성 점수,
          개별 보고서를 정리할 수 있도록 돕는 교사용 도구입니다.
        </p>

        <div class="auth-panel" aria-live="polite">
          <div class="hero-actions">
            <button class="button primary" id="googleLoginButton" type="button">Google 로그인</button>
            <button class="button ghost" id="logoutButton" type="button" hidden>로그아웃</button>
          </div>
          <p class="auth-message" id="authMessage">교사 로그인이 필요합니다.</p>
          <p class="teacher-profile" id="teacherProfile" hidden></p>
        </div>

        <div class="teacher-actions" id="teacherActions" hidden>
          <a class="button secondary" href="student.html">학생 활동 및 검사하기</a>
          <a class="button primary" href="teacherMonitor.html">교사 모니터링</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
